# CI: lint and test the rexel-client package across Python 3.10-3.12.
# Runs on ubuntu-latest (GitHub-hosted) rather than the org self-hosted pool: this
# is a tiny pure-Python library with no private build deps, and the sibling
# publish.yml needs a GitHub-hosted runner for PyPI OIDC trusted publishing anyway,
# so keeping both workflows on ubuntu-latest avoids standing up self-hosted plumbing
# for zero gain.
# Canon: bess-documentation/infrastructure/self-hosted-runner-ci-patterns.md
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check src tests

      - name: Run tests
        run: |
          pytest -v --cov=rexel_client --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Check formatting
        run: |
          ruff format --check src tests

      - name: Check linting
        run: |
          ruff check src tests
